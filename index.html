<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zxcursetdyf</title>
    
    <!-- Иконки и шрифт -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.07);
            --accent: #ffffff;
            --dim: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.1;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 850px;
            z-index: 2;
            padding: 40px 0;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .profile {
            grid-column: span 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 24px;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 45px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .sub {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--dim);
            margin-top: 8px;
        }

        /* Блок Бота с выравниванием по центру */
        .bot { 
            grid-column: span 4; 
            display: flex;
            align-items: center;
            justify-content: center; /* Центрируем содержимое */
            gap: 20px; 
            padding: 35px;
        }
        
        .bot-title {
            font-size: 1.6rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .link i {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: repeat(2, 1fr); }
            .profile, .bot { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Профиль -->
        <div class="card profile">
            <img src="утро апреля (1).jpg" alt="zxcursetdyf" class="avatar">
            <h1>zxcursetdyf</h1>
            <p class="sub"></p>
        </div>

        <!-- Блок Бота (Текст по центру) -->
        <a href="https://t.me/zxcursetdyf_bot" class="card bot">
            <i class="fab fa-telegram-plane" style="font-size: 2.2rem; color: #fff;"></i>
            <span class="bot-title">zxcursetdyf_bot</span>
        </a>

        <!-- Соцсети -->
        <a href="https://t.me/zxcursetdyf" class="card link">
            <i class="fab fa-telegram"></i>
            <span>TELEGRAM</span>
        </a>

        <a href="https://twitch.tv/zxcursetdyf" class="card link">
            <i class="fab fa-twitch"></i>
            <span>TWITCH</span>
        </a>

        <a href="https://www.tiktok.com/@zxcursetdyf" class="card link">
            <i class="fab fa-tiktok"></i>
            <span>TIKTOK</span>
        </a>

        <a href="https://instagram.com/zxcursetdyf" class="card link">
            <i class="fab fa-instagram"></i>
            <span>INSTAGRAM</span>
        </a>
    </div>

</body>
</html>
